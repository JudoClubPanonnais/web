name: Deploy Blue Circle

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/stoic-pasteur-jxj6p9

      - name: Deploy to Vercel
        run: |
          VTOKEN="${{ secrets.VERCEL_TOKEN }}"

          PROJECTS=$(curl -s https://api.vercel.com/v9/projects \
            -H "Authorization: Bearer $VTOKEN")
          PROJECT_ID=$(echo "$PROJECTS" | jq -r '.projects[0].id // empty')
          PROJECT_NAME=$(echo "$PROJECTS" | jq -r '.projects[0].name // empty')

          if [ -z "$PROJECT_ID" ]; then
            echo "Creating Vercel project..."
            NEWPROJ=$(curl -s -X POST https://api.vercel.com/v10/projects \
              -H "Authorization: Bearer $VTOKEN" \
              -H "Content-Type: application/json" \
              -d '{"name":"blue-circle","framework":"nextjs","gitRepository":{"type":"github","repo":"tokkimi/webapp"}}')
            PROJECT_ID=$(echo "$NEWPROJ" | jq -r '.id')
            PROJECT_NAME="blue-circle"
          fi

          echo "Project: $PROJECT_NAME ($PROJECT_ID)"
          APP_URL="https://${PROJECT_NAME}.vercel.app"

          add_env() {
            curl -s -X POST "https://api.vercel.com/v10/projects/$PROJECT_ID/env" \
              -H "Authorization: Bearer $VTOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"$1\",\"value\":\"$2\",\"type\":\"encrypted\",\"target\":[\"production\",\"preview\"]}" > /dev/null
            echo "  Set $1"
          }

          add_env "NEXT_PUBLIC_SUPABASE_URL"      "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co"
          add_env "NEXT_PUBLIC_SUPABASE_ANON_KEY" "${{ secrets.SUPABASE_ANON_KEY }}"
          add_env "SUPABASE_SERVICE_ROLE_KEY"     "${{ secrets.SUPABASE_SERVICE_KEY }}"
          add_env "STRIPE_SECRET_KEY"             "${{ secrets.STRIPE_SECRET_KEY }}"
          add_env "ANTHROPIC_API_KEY"             "${{ secrets.ANTHROPIC_API_KEY }}"
          add_env "REPLICATE_API_TOKEN"           "${{ secrets.REPLICATE_API_TOKEN }}"
          add_env "STRIPE_PRICE_ESSENTIEL"        "price_1TgJdI6X2FdrY3WEnoEm1T46"
          add_env "STRIPE_PRICE_ILLIMITE"         "price_1TgJdI6X2FdrY3WE9ZQxIi6w"
          add_env "STRIPE_PRICE_PREMIUM"          "price_1TgJdJ6X2FdrY3WEMKSq6gLU"
          add_env "STRIPE_PRICE_ELITE"            "price_1TgJdJ6X2FdrY3WEACorUdEv"
          add_env "NEXT_PUBLIC_APP_URL"           "$APP_URL"
          add_env "STRIPE_WEBHOOK_SECRET"         "whsec_to_configure"

          echo "All env vars set"

          DEPLOY=$(curl -s -X POST https://api.vercel.com/v13/deployments \
            -H "Authorization: Bearer $VTOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$PROJECT_NAME\",\"gitSource\":{\"type\":\"github\",\"repoId\":\"tokkimi/webapp\",\"ref\":\"claude/stoic-pasteur-jxj6p9\"}}")

          DEPLOY_URL=$(echo "$DEPLOY" | jq -r '.url // empty')
          echo ""
          echo "==================================="
          echo "BLUE CIRCLE DEPLOYE !"
          echo "Site: $APP_URL"
          if [ -n "$DEPLOY_URL" ]; then
            echo "Preview: https://$DEPLOY_URL"
          fi
          echo "==================================="
